<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 25% 35%, #1b2330 0%, #0f1216 70%);
    color: #e6e9ee; font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 0 36px; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 64px; height: 64px; }
  .brand span { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 18px 0 0; font-size: 22px; line-height: 1.3; color: #b9c2ce; }
  p em { font-style: normal; color: #f0a030; font-weight: 600; }
</style>
</head>
<body>
  <div class="brand"><img src="../../../extension/icons/icon-128.png" alt=""><span>Ringtail</span></div>
  <p>Highlight to detect.<br>Rules that are <em>proven</em> to fire.</p>
</body>
</html>
