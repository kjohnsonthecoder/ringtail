[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ringtail"
version = "0.2.0"
description = "Plain English in, rules that must fire out: Sigma rules drafted by AI, proven by tests."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kevin Johnson" }]
# pySigma 2.x needs google-re2 and PyYAML's C loader, which don't ship for 3.15 yet.
# See docs/decisions/0001-test-engine.md.
requires-python = ">=3.11,<3.15"
dependencies = [
    "pysigma>=2.0,<3",
    "typer>=0.12",
    # Already installed by pySigma; declared because card.py imports it directly.
    "pyyaml>=6",
    "anthropic>=2.10",
    # SIEM conversion (ADR 0004). Pinned to a minor version: cards embed its output and CI
    # fails on a stale card, so an upgrade should be a deliberate commit that regenerates them.
    "pysigma-backend-splunk>=3.0.1,<3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
# httpx powers FastAPI's TestClient, used by the backend tests.
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
ringtail = "ringtail.cli:app"

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
ringtail = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can import backend.app (the backend is not part of the wheel).
pythonpath = ["."]
