title: Volume Shadow Copies Deleted From the Command Line
id: 2a2557f5-2139-4d36-af82-1b4bb5b9abe1
status: experimental
description: |
  Detects shadow copy deletion with vssadmin, wmic, or PowerShell's Win32_ShadowCopy class.
  Ransomware deletes shadow copies right before or during encryption so victims can't roll
  files back. Akira, Conti, LockBit, and many others do it. It's one of the last chances to
  catch an intrusion before impact.
references:
  - https://attack.mitre.org/techniques/T1490/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/vssadmin-delete-shadows
author: Kevin Johnson (Ringtail Frontline Pack)
date: 2026-11-18
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin_img:
    - Image|endswith: '\vssadmin.exe'
    - OriginalFileName: 'VSSADMIN.EXE'
  selection_vssadmin_cli:
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic_img:
    - Image|endswith: '\wmic.exe'
    - OriginalFileName: 'wmic.exe'
  selection_wmic_cli:
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_ps_class:
    CommandLine|contains: 'Win32_ShadowCopy'
  selection_ps_action:
    CommandLine|contains:
      - '.Delete('
      - 'Remove-CimInstance'
      - 'Remove-WmiObject'
  condition: (selection_vssadmin_img and selection_vssadmin_cli) or (selection_wmic_img and selection_wmic_cli) or (selection_ps_class and selection_ps_action)
falsepositives:
  - Backup or storage software that prunes old shadow copies with vssadmin (check the parent process against your baseline)
  - Administrators freeing disk space on a full volume
level: high
