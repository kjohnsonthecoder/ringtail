# Real attack recordings for `ringtail backtest` (ADR 0006).
#
# Source: OTRF Security-Datasets (MIT), pinned to one commit; every file is checked against
# its SHA-256 before use. `techniques` were verified by reading each recording's process
# events, not taken from the file name.
#
# Expectations are reviewable human statements:
#   fires: rules that must fire on this recording (CI fails if one goes quiet)
#   gaps:  rules that cover this technique but not this method, and why (reported as gaps)
# Any other rule that fires is reported as "unexpected" and needs review.

