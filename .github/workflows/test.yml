name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # No API key here on purpose: CI only validates and tests committed rules. It never calls the LLM.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Validate rules (pySigma lint + pinned ATT&CK)
        run: ringtail validate rules/
      - name: Rule tests (true positive / false positive replay)
        run: ringtail test rules/
      - name: Detection cards are up to date
        run: ringtail card rules/ --check
      - name: Every rule converts to Splunk SPL and KQL
        run: ringtail convert rules/ > /dev/null
      - name: Shared browser loop (node --test, no npm packages)
        run: node --test tests/js/client.test.mjs
      - name: Cache real attack recordings (pinned by commit and SHA-256)
        uses: actions/cache@v4
        with:
          path: .cache/datasets
          key: otrf-${{ hashFiles('data/datasets/otrf.yml') }}
      - name: Real-data backtest is up to date (OTRF recordings)
        run: ringtail backtest --check
      - name: ATT&CK kill-chain coverage image is up to date
        run: ringtail coverage --check
      - name: Install RSigma v0.27.0 (pinned, SHA-256 checked)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/rsigma.tar.gz" https://github.com/timescale/rsigma/releases/download/v0.27.0/rsigma-x86_64-unknown-linux-gnu.tar.gz
          echo "2da1432dd71d9ac9080ccbf046532850331cb672f85d394e340ec18ab1d5d44b  $RUNNER_TEMP/rsigma.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rsigma"
          tar xzf "$RUNNER_TEMP/rsigma.tar.gz" -C "$RUNNER_TEMP/rsigma" ./rsigma
          echo "$RUNNER_TEMP/rsigma" >> "$GITHUB_PATH"
      - name: Second engine agrees (RSigma vs Ringtail matcher)
        run: ringtail crosscheck --require
